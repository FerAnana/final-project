<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Sofia's kitchen</title>
  </head>
  <body>
    <header id="main-header">
      <button id="side-bar"></button>
      <div id="side-content"></div>
      <p>
        <img alt="logo" src="images/logo.webp" width="70px" height="" /> Sofia's
        kitchen
      </p>
    </header>
    <main class="hero-container">
      <picture class="image-display">
        <source srcset="images/hero.webp" media="(min-width: 450px)" />
        <img alt="Food on table" src="images/hero-mobile.webp" />
      </picture>

      <div class="hero-content">
        <h1>Sofia's kitchen</h1>
        <p>
          Find and enjoy thousands of recipes at your hand! From breakfast to
          desserts and more!
        </p>
        <div class="buttons">
          <button>Categories</button>
          <button>Surprise me!</button>
        </div>
        <input type="text" placeholder="Chicken, beef, lasagna..." />
      </div>
    </main>
    <footer id="main-footer">
      <div id="" class="personal-info">
        <p>© 2026 | Fernando Añaña</p>
        <p>+555 123 456</p>
        <p>email@example.com</p>
      </div>
      <div class="social-media">
        <a href="linkedin.com">
          <img alt="linkeding logo" src="images/linkedin.svg" />
        </a>
        <a href="github.com">
          <img alt="github logo" src="images/github.svg" />
        </a>
        <a href="instagram.com">
          <img alt="instagram logo" src="images/instagram.svg" />
        </a>
      </div>
    </footer>
  </body>
</html>
